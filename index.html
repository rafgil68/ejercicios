<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="manifest" href="manifest.json">
    <title>Isometrix2 - Entrenamiento</title>
    <style>
		html { font-size: 18px; }
        body { font-family: sans-serif;
            background: linear-gradient(180deg, #1b1f27 0%, #121212 40%) fixed;
            background-color: #121212;
            color: white;
            padding: 10px;
            text-align: center;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column; }

        .ejercicio-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            margin: 10px auto;
            width: 100%;
            max-width: 600px;
        }

		.btn-principal {
			display: block;
			width: 80%;
			max-width: 300px;
			margin: 20px auto;
			padding: 15px;
			border-radius: 50px;
			border: none;
			background-color: #2ecc71;
			color: white;
			font-weight: bold;
			cursor: pointer;
		}

		/* Botones de navegación (Anterior / Siguiente) */
		.fila-navegacion {
			display: none;
			justify-content: space-between;
			gap: 10px;
			margin: 15px auto 0;
			max-width: 300px;
		}
		.btn-nav {
			flex: 1;
			padding: 12px 10px;
			border-radius: 50px;
			border: none;
			background-color: #333;
			color: white;
			font-weight: bold;
			cursor: pointer;
			font-size: 0.95rem;
		}
		.btn-nav:disabled { opacity: 0.35; cursor: not-allowed; }

		.contenedor-img-ej {
			position: relative; width: 100%; flex: 1 1 auto; min-height: 200px; max-height: 560px;
			margin: 10px 0 0; overflow: hidden; background: #1a1a1a; border-radius: 15px;
		}
		#ui-imagen-ejercicio { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }

		/* Botón de Ajustes (Arriba a la derecha) */
        .btn-config {
			width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer;
			background: #23262d; font-size: 1.3rem; flex-shrink: 0;
		}

        .input-tiempo {
			width: 50px;
			padding: 6px 4px;
			background-color: #333;
			border: 1px solid #555;
			color: white;
			border-radius: 5px;
			text-align: center;
			font-size: 1rem;
			font-weight: bold;
		}
		.input-peso { width: 64px; }

		/* ---------- Portada ---------- */
		.topbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 0; width: 100%; max-width: 600px; align-self: center; box-sizing: border-box; }
		.marca { display: flex; align-items: center; gap: 10px; }
		.marca h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
		#ui-logo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 14px rgba(93, 173, 226, 0.45); }
		.saludo { margin: 22px 0 6px; }
		.saludo h2 { margin: 0; font-size: 1.6rem; }
		.saludo p { margin: 6px 0 0; color: #8a8f98; font-size: 0.85rem; }

		#portada { display: flex; flex-direction: column; gap: 14px; flex: 1; padding: 14px 4px 18px; width: 100%; max-width: 600px; align-self: center; box-sizing: border-box; }
		.dia-card {
			display: flex; flex-direction: column; justify-content: space-between; flex: 1 1 auto; max-height: 250px;
			width: 100%; text-align: left; border: none; color: white; cursor: pointer;
			padding: 14px 16px; border-radius: 18px; font-family: inherit;
			background: linear-gradient(90deg, rgba(var(--rgb), 0.24), #1c1f26 72%);
			border-left: 6px solid rgb(var(--rgb));
			box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
			transition: transform 0.12s;
		}
		.dia-card:active { transform: scale(0.98); }
		.dia-top { display: flex; justify-content: space-between; align-items: baseline; }
		.dia-titulo { font-size: 1.35rem; font-weight: 800; }
		.dia-go { font-size: 0.85rem; font-weight: bold; color: rgb(var(--rgb)); }
		.dia-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.8rem; color: #aab0ba; }
		.mini-chip { background: rgba(255, 255, 255, 0.09); color: #dfe3ea; padding: 2px 9px; border-radius: 10px; font-size: 0.7rem; }
		.dia-thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
		.dia-thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #111; border-radius: 9px; }
		.dia-thumbs .sin-img { aspect-ratio: 1; }
		.dia-thumbs .mas { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; background: rgba(255, 255, 255, 0.08); border-radius: 9px; font-size: 0.8rem; font-weight: bold; color: #aab0ba; }

		/* Recuadro de respaldo cuando falta el archivo de imagen */
		.sin-img { display: flex; align-items: center; justify-content: center; background: #262a33; color: #7d8590; font-weight: bold; font-size: 0.75rem; border-radius: 9px; overflow: hidden; }
		.card-ej .sin-img { height: 100px; margin-bottom: 6px; font-size: 1.1rem; }

		/* ---------- Entrenamiento: progreso y anillo ---------- */
		.progreso { margin-bottom: 10px; text-align: left; }
		.progreso-txt { display: flex; justify-content: space-between; font-size: 0.8rem; color: #aab0ba; margin-bottom: 6px; }
		.barra { height: 8px; background: #2a2d35; border-radius: 6px; overflow: hidden; }
		.barra-fill { height: 100%; width: 0; background: rgb(var(--rgb)); border-radius: 6px; transition: width 0.35s; }
		.anillo { position: relative; width: 104px; flex-shrink: 0; aspect-ratio: 1; }
		.anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
		.anillo circle { fill: none; stroke-width: 10; }
		.anillo-fondo { stroke: #2a2d35; }
		.anillo-prog { stroke: rgb(var(--rgb)); stroke-linecap: round; stroke-dasharray: 553; stroke-dashoffset: 0; }
		.anillo.urgente .anillo-prog { stroke: #e74c3c; }
		.anillo-centro { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
		.anillo-centro span { font-size: 1.9rem; font-weight: 900; line-height: 1; }
		.anillo-centro small { color: #8a8f98; font-size: 0.6rem; margin-top: 2px; }
		.fila-reloj { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; margin-top: 12px; }
		.reloj-info { flex: 1; min-width: 0; text-align: left; }
		.fila-reloj.fin .reloj-info { text-align: center; }
		#ui-info { margin: 0; font-size: 1.05rem; font-weight: bold; white-space: pre-line; }
		.desc { margin: 0 0 6px; color: #aab0ba; font-size: 0.8rem; }
		.desc:empty { display: none; }
		.siguiente { color: #8a8f98; font-size: 0.8rem; margin: 6px 0 0; }
		#vista-entreno { flex: 1; flex-direction: column; padding: 12px 14px; box-sizing: border-box; }
		#vista-entreno .progreso { width: 100%; box-sizing: border-box; }
		#vista-entreno .fila-navegacion { width: 100%; margin: 10px auto 0; }
		.en-entreno .saludo { margin: 10px 0 8px; }
		.en-entreno .saludo h2 { font-size: 1.35rem; }
		#vista-entreno .btn-principal { background: rgb(var(--rgb)); margin: 14px auto 0; }

		/* ---------- Portada: sugerencia e historial ---------- */
		.dia-card.sugerida { box-shadow: 0 0 0 2px rgba(var(--rgb), 0.85), 0 8px 24px rgba(var(--rgb), 0.28); }
		.badge-sig { background: rgb(var(--rgb)); color: #fff; font-size: 0.62rem; font-weight: 800; padding: 3px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; letter-spacing: 0.04em; text-transform: uppercase; }
		.dia-ultimo { font-size: 0.75rem; color: #8a8f98; margin-top: 5px; }
		.dia-ultimo.ok { color: #2ecc71; }

		/* ---------- Pantalla de ajustes ---------- */
        #pantalla-ajustes {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			background-color: #121212; z-index: 10000; padding: 20px 16px;
			overflow-y: auto; text-align: left; box-sizing: border-box;
		}
		#pantalla-ajustes h2 { margin: 0 0 10px; }
		.tabs { display: flex; gap: 8px; margin: 10px 0 16px; }
		.tab { flex: 1; padding: 10px 2px; border-radius: 10px; border: none; background: #2a2a2a; color: #ccc; font-weight: bold; font-size: 0.74rem; cursor: pointer; }
		.tab.activa { background: #fff; color: #121212; }
		.pills { display: flex; gap: 8px; margin-bottom: 12px; }
		.pill { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid transparent; color: white; font-weight: bold; opacity: 0.5; cursor: pointer; }
		.pill.activa { opacity: 1; border-color: white; }
		.nota { color: #888; font-size: 0.75rem; margin: 0 0 12px; }

		.rut-fila { background: #1a1a1a; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
		.rut-sup { display: flex; align-items: center; gap: 10px; }
		.mini { width: 52px; height: 52px; object-fit: contain; background: #111; border-radius: 8px; flex-shrink: 0; }
		.rut-nombre { flex: 1; font-weight: bold; font-size: 0.9rem; }
		.rut-nombre small { display: block; color: #888; font-weight: normal; font-size: 0.75rem; margin-top: 2px; }
		.rut-ctrl { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
		.rut-ctrl label { font-size: 0.7rem; color: #999; display: flex; align-items: center; gap: 4px; }
		.espacio { flex: 1; }
		.btn-ico { width: 36px; height: 36px; border-radius: 8px; border: none; background: #333; color: white; font-size: 1rem; cursor: pointer; }
		.btn-ico:disabled { opacity: 0.25; cursor: not-allowed; }
		.btn-sec { display: block; width: 100%; padding: 13px; border-radius: 12px; border: 1px dashed #666; background: transparent; color: white; font-weight: bold; margin: 8px 0; cursor: pointer; }
		.btn-peligro { border-color: #c0392b; color: #e74c3c; }
		.sub-grupo { margin: 18px 0 8px; font-size: 0.8rem; color: #2ecc71; text-transform: uppercase; letter-spacing: 0.06em; }
		.vacio { color: #888; text-align: center; padding: 20px 0; }

		.fila-lib { display: flex; align-items: center; gap: 10px; background: #1a1a1a; padding: 8px 10px; margin-bottom: 8px; border-radius: 10px; }
		.fila-lib .nombre { flex: 1; font-size: 0.9rem; }
		.fila-lib .unidad { font-size: 0.75rem; color: #888; width: 78px; }

		/* ---------- Ejercicios propios ---------- */
		.buscar { width: 100%; box-sizing: border-box; padding: 11px; border-radius: 10px; border: 1px solid #555; background: #222; color: white; font-size: 1rem; margin: 6px 0; }
		.fila-ej { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #1a1a1a; border: none; color: white; padding: 8px 10px; margin-bottom: 8px; border-radius: 10px; font-family: inherit; cursor: pointer; box-sizing: border-box; }
		.fila-ej.fija { cursor: default; }
		.fila-ej .txt { flex: 1; min-width: 0; }
		.fila-ej .n { font-size: 0.9rem; font-weight: bold; }
		.fila-ej .s { font-size: 0.72rem; color: #8a8f98; margin-top: 2px; }
		.fila-ej .lapiz { color: #8a8f98; font-size: 1.1rem; }
		.etq { font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: #2b3a55; color: #9cc2ff; margin-left: 6px; vertical-align: middle; }
		.etq.pend { background: #4a3a1a; color: #ffc46b; }
		.etq.ok { background: #1d3d2a; color: #6fe0a0; }

		#form-ejercicio { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10002; background: #121212; padding: 16px; overflow-y: auto; box-sizing: border-box; text-align: left; }
		#form-ejercicio h2 { margin: 0 0 8px; }
		.campo { margin: 12px 0; }
		.campo label { display: block; font-size: 0.75rem; color: #999; margin-bottom: 4px; }
		.campo input[type=text], .campo input[type=number], .campo input[type=password], .campo select { width: 100%; box-sizing: border-box; padding: 11px; border-radius: 10px; border: 1px solid #555; background: #222; color: white; font-size: 1rem; }
		.campo.check label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #ddd; }
		.foto-prev { display: flex; align-items: center; justify-content: center; width: 100%; height: 180px; background: #1a1a1a; border-radius: 12px; overflow: hidden; color: #777; font-size: 0.85rem; margin-bottom: 8px; }
		.foto-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }

		#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 88%; background: #2b2f38; color: white; padding: 10px 16px; border-radius: 12px; font-size: 0.85rem; z-index: 10050; opacity: 0; pointer-events: none; transition: opacity 0.25s; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
		#toast.ver { opacity: 1; }

		/* ---------- Selector de ejercicios ---------- */
		#selector-ejercicios {
			display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
			z-index: 10001; background: #121212; padding: 16px; overflow-y: auto;
			box-sizing: border-box; text-align: left;
		}
		#selector-ejercicios h2 { margin: 0 0 10px; }
		#sel-buscar { width: 100%; box-sizing: border-box; padding: 11px; border-radius: 10px; border: 1px solid #555; background: #222; color: white; font-size: 1rem; }
		.chips { display: flex; gap: 8px; margin: 10px 0; overflow-x: auto; padding-bottom: 4px; }
		.chip { flex-shrink: 0; white-space: nowrap; padding: 8px 14px; border-radius: 20px; border: none; background: #2a2a2a; color: #ccc; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
		.chip.activa { background: #fff; color: #121212; }
		.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
		.card-ej { background: #1e1e1e; border: none; border-radius: 12px; padding: 8px; color: white; text-align: center; font-size: 0.8rem; cursor: pointer; }
		.card-ej img { width: 100%; height: 100px; object-fit: contain; background: #111; border-radius: 8px; margin-bottom: 6px; }
		.card-ej em { display: block; color: #2ecc71; font-size: 0.7rem; font-style: normal; margin-top: 2px; }
	</style>
</head>
<body>
   <header class="topbar">
        <div class="marca">
            <img id="ui-logo" src="Isometrix.png" alt="" onerror="this.style.display='none'">
            <h1>Isometrix2</h1>
        </div>
        <button class="btn-config" onclick="abrirAjustes()" aria-label="Ajustes">⚙️</button>
    </header>

    <div class="saludo">
        <h2 id="ui-nombre">¿Qué toca hoy?</h2>
        <p id="ui-sub">Elige una rutina para empezar</p>
    </div>

    <main id="portada"></main>

    <div id="vista-entreno" class="ejercicio-card" style="display:none">
        <div class="progreso">
            <div class="progreso-txt"><span id="ui-prog-txt"></span><span id="ui-prog-dia"></span></div>
            <div class="barra"><div id="ui-prog-fill" class="barra-fill"></div></div>
        </div>
        <div class="contenedor-img-ej">
            <img id="ui-imagen-ejercicio" src="" onerror="this.style.visibility='hidden'">
        </div>

		<div class="fila-reloj">
            <div id="ui-timer" class="anillo" style="display: none;">
                <svg viewBox="0 0 200 200">
                    <circle class="anillo-fondo" cx="100" cy="100" r="88"></circle>
                    <circle id="ui-anillo" class="anillo-prog" cx="100" cy="100" r="88"></circle>
                </svg>
                <div class="anillo-centro"><span id="ui-timer-num">0</span><small id="ui-timer-label"></small></div>
            </div>
            <div class="reloj-info">
                <p id="ui-desc" class="desc"></p>
                <p id="ui-info"></p>
                <p id="ui-siguiente" class="siguiente"></p>
            </div>
        </div>

        <button id="btn-control" class="btn-principal" onclick="manejarAccion()" style="display: none;">EMPEZAR</button>

        <div id="fila-navegacion" class="fila-navegacion">
            <button id="btn-anterior" class="btn-nav" onclick="irAnterior()">⬅ Anterior</button>
            <button id="btn-siguiente" class="btn-nav" onclick="irSiguiente()">Siguiente ➡</button>
        </div>
    </div>

	<!-- Ajustes: rutinas / tiempos / copia -->
	<div id="pantalla-ajustes">
		<h2>Ajustes</h2>
		<div class="tabs">
			<button class="tab" data-tab="rutinas" onclick="irTab('rutinas')">Rutinas</button>
			<button class="tab" data-tab="ejercicios" onclick="irTab('ejercicios')">Ejercicios</button>
			<button class="tab" data-tab="tiempos" onclick="irTab('tiempos')">Tiempos</button>
			<button class="tab" data-tab="copia" onclick="irTab('copia')">Copia</button>
		</div>
		<div id="aj-contenido"></div>
		<button class="btn-principal" onclick="cerrarAjustes()">VOLVER</button>
	</div>

	<!-- Formulario de ejercicio propio -->
	<div id="form-ejercicio"></div>
	<div id="toast"></div>

	<!-- Selector de ejercicios (rejilla con imágenes) -->
	<div id="selector-ejercicios">
		<h2 id="sel-titulo">Elegir ejercicio</h2>
		<input id="sel-buscar" type="search" placeholder="Buscar ejercicio..." oninput="pintarSelector()">
		<div id="chips-grupo" class="chips"></div>
		<div id="chips-tipo" class="chips"></div>
		<div id="sel-grid" class="grid"></div>
		<button class="btn-principal" style="background:#444" onclick="cerrarSelector()">CANCELAR</button>
	</div>

    <script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('sw.js')
				.then(reg => console.log('Service Worker registrado', reg))
				.catch(err => console.error('Error en Service Worker', err));
		}

		// --- Wake Lock: mantiene la pantalla encendida mientras se usa la app ---
		let wakeLock = null;

		async function solicitarWakeLock() {
			if (!('wakeLock' in navigator)) return;
			try {
				wakeLock = await navigator.wakeLock.request('screen');
				wakeLock.addEventListener('release', () => {
					wakeLock = null;
					console.log('Wake Lock liberado');
				});
			} catch (err) {
				console.error('No se pudo activar Wake Lock:', err);
			}
		}
		document.addEventListener('visibilitychange', () => {
			if (wakeLock === null && document.visibilityState === 'visible') solicitarWakeLock();
		});
		solicitarWakeLock();
		document.addEventListener('click', () => {
			if (wakeLock === null) solicitarWakeLock();
		}, { once: true });

		/* =====================================================================
		   BIBLIOTECA FIJA DE EJERCICIOS (organizada en cuatro carpetas)
		   ===================================================================== */
		/* Tipos = las cuatro carpetas. Calentamiento, isométricos y estiramientos se controlan
		   por TIEMPO; fuerza por REPETICIONES. */
		const TIPOS = {
			calent:  { nombre: 'Calentamiento', tiempo: true },
			iso:     { nombre: 'Isométricos',   tiempo: true },
			fuerza:  { nombre: 'Fuerza',        tiempo: false },
			estirar: { nombre: 'Estiramientos', tiempo: true }
		};
		const esTiempo = b => TIPOS[b.tipo] ? TIPOS[b.tipo].tiempo : true;
		const GRUPOS = ['Pierna', 'Pecho', 'Espalda', 'Hombros', 'Brazos', 'Core', 'Movilidad'];

		/* 'valor' = segundos (calent/iso/estirar) o repeticiones (fuerza), igual en todos los días.
		   'unilateral': con N series se alternan dcha/izda (N por lado).
		   'desc' (opcional): texto explicativo que se muestra durante el ejercicio. */
		const BIBLIOTECA_BASE = [
			// ---- CALENTAMIENTO (por tiempo) · carpeta calentamiento/ ----
			{ id: 'general', nombre: 'Calentamiento general', tipo: 'calent', valor: 120, img: 'calentamiento/general.png', grupo: 'Movilidad', desc: 'Marcha elevando rodillas, jumping jacks suaves y círculos de brazos.' },
			{ id: 'mov_hombro', nombre: 'Movilidad hombros', tipo: 'calent', valor: 30, img: 'calentamiento/mov_hombro.png', grupo: 'Movilidad' },
			{ id: 'mov_espalda', nombre: 'Movilidad espalda', tipo: 'calent', valor: 45, img: 'calentamiento/mov_espalda.png', grupo: 'Movilidad' },
			{ id: 'cadera', nombre: 'Rotaciones cadera', tipo: 'calent', valor: 30, img: 'calentamiento/cadera.png', grupo: 'Movilidad' },
			{ id: 'sentadilla_sin', nombre: 'Sentadilla sin peso', tipo: 'calent', valor: 5, img: 'calentamiento/sentadilla_sin.png', grupo: 'Pierna' },
			{ id: 'buenos_dias', nombre: 'Buenos días', tipo: 'calent', valor: 45, img: 'calentamiento/Buenos_dias.png', grupo: 'Espalda' },
			{ id: 'bird_dog', nombre: 'Bird dog', tipo: 'calent', valor: 45, img: 'calentamiento/bird_dog.png', grupo: 'Core' },
			{ id: 'puente', nombre: 'Puente glúteo iso', tipo: 'calent', valor: 60, img: 'calentamiento/puente.png', grupo: 'Pierna' },
			{ id: 'colgado', nombre: 'Colgado activo', tipo: 'calent', valor: 15, img: 'calentamiento/colgado.png', grupo: 'Espalda' },

		// Autocomprobación: ids repetidos (se ignora el segundo), tipos y grupos mal escritos
		(function validarBiblioteca() {
			const vistos = new Set();
			for (let i = 0; i < BIBLIOTECA_BASE.length; i++) {
				const b = BIBLIOTECA_BASE[i];
				if (vistos.has(b.id)) { console.warn('Biblioteca: id repetido, se ignora ->', b.id, b.nombre); BIBLIOTECA_BASE.splice(i--, 1); continue; }
				vistos.add(b.id);
				if (!TIPOS[b.tipo]) console.warn('Biblioteca: tipo desconocido en', b.id, b.tipo);
				const g = GRUPOS.find(x => x.toLowerCase() === String(b.grupo).toLowerCase());
				if (g) b.grupo = g;
				else { console.warn('Biblioteca: grupo desconocido en', b.id, JSON.stringify(b.grupo), '-> Movilidad'); b.grupo = 'Movilidad'; }
			}
		})();

		const BASE_IDS = new Set(BIBLIOTECA_BASE.map(b => b.id));
		const CARPETAS = { calent: 'calentamiento', iso: 'isometricos', fuerza: 'fuerza', estirar: 'estiramientos' };

		// BIBLIOTECA = ejercicios base (en el código) + ejercicios propios (creados desde la app).
		// Se reconstruye en el sitio, para que todas las referencias sigan siendo válidas.
		const BIBLIOTECA = [];
		const EJ = {};
		function reconstruirBiblioteca(propios) {
			BIBLIOTECA.length = 0;
			Object.keys(EJ).forEach(k => delete EJ[k]);
			BIBLIOTECA_BASE.concat(propios || []).forEach(b => {
				if (EJ[b.id]) return;
				BIBLIOTECA.push(b);
				EJ[b.id] = b;
			});
		}
		reconstruirBiblioteca([]);
		const esPropio = b => !!b.sync;

		// Ruta de imagen válida: carpeta/archivo.png|jpg|jpeg|webp|gif (sin "..", sin ñ ni espacios)
		function limpiarRuta(r) {
			r = String(r || '').trim();
			if (!r || r.length > 120 || r.includes('..') || r.startsWith('/')) return '';
			return /^(?:[\w\-]+\/)*[\w\-.]+\.(?:png|jpe?g|webp|gif)$/i.test(r) ? r : '';
		}

		// Valida un ejercicio propio (creado aquí, guardado o recibido de GitHub)
		function limpiarEj(x, conSync) {
			if (!x || typeof x !== 'object') return null;
			const id = String(x.id || '');
			if (!/^[a-z0-9_]{1,60}$/.test(id) || BASE_IDS.has(id)) return null;
			const nombre = String(x.nombre || '').trim().slice(0, 80);
			if (!nombre || !TIPOS[x.tipo]) return null;
			const valor = Math.round(Number(x.valor));
			if (!(valor > 0 && valor < 10000)) return null;
			const o = {
				id, nombre, tipo: x.tipo, valor,
				grupo: GRUPOS.find(g => g.toLowerCase() === String(x.grupo).toLowerCase()) || 'Movilidad'
			};
			if (x.tipo === 'fuerza') o.peso = String(x.peso === undefined ? '0' : x.peso).slice(0, 12);
			if (x.unilateral) o.unilateral = true;
			if (typeof x.desc === 'string' && x.desc.trim()) o.desc = x.desc.trim().slice(0, 200);
			o.img = limpiarRuta(x.img);
			if (conSync) {
				o.sync = x.sync === 'subido' ? 'subido' : 'local';
				if (x.dirty) o.dirty = true;
				if (x.fotoPendiente) o.fotoPendiente = true;
				if (Number(x.subidoTs) > 0) o.subidoTs = Number(x.subidoTs);
			}
			return o;
		}
		function sanearCustom(arr) {
			if (!Array.isArray(arr)) return [];
			const vistos = new Set();
			return arr.map(x => limpiarEj(x, true)).filter(x => x && !vistos.has(x.id) && vistos.add(x.id));
		}
		function limpiarListaRemota(data) {
			const arr = Array.isArray(data) ? data : (data && Array.isArray(data.ejercicios) ? data.ejercicios : null);
			if (!arr) throw new Error('formato');
			const vistos = new Set();
			return arr.map(x => limpiarEj(x, false)).filter(x => x && !vistos.has(x.id) && vistos.add(x.id));
		}
		// Forma que se guarda en ejercicios.json (sin los campos internos de sincronización)
		function paraJson(c) {
			const o = { id: c.id, nombre: c.nombre, tipo: c.tipo, grupo: c.grupo, valor: c.valor };
			if (c.peso !== undefined) o.peso = c.peso;
			if (c.unilateral) o.unilateral = true;
			if (c.desc) o.desc = c.desc;
			o.img = c.img || '';
			return o;
		}

		// Ejercicios cuyo id ha cambiado: se traducen para no perder rutinas ni tiempos ya guardados
		const MIGRACION_IDS = { peso_muerto: 'peso_muerto_rum', esfinge: 'cobra' };

		const DIAS = ['dia1', 'dia2', 'dia3'];
		const NOMBRES = { dia1: 'Día 1', dia2: 'Día 2', dia3: 'Día 3' };

		/* =====================================================================
		   ESTADO (guardado en localStorage)
		   estado.tiempos[idEjercicio] = segundos o reps (común a todos los días)
		   estado.rutinas[dia] = [ { id, series, peso? }, ... ]  (en orden)
		   ===================================================================== */
		function rutinasPorDefecto() {
			const it = (id, series = 1, peso) => {
				const o = { id, series };
				if (peso !== undefined) o.peso = peso;
				return o;

				],
				dia3: [
					it('mov_hombro'), it('sentadilla_sin'), it('buenos_dias'), it('cobra'),
					it('flexion', 2), it('puente'), it('plancha', 2),
					it('goblet'), it('hombro'), it('remo'), it('peso_muerto_rum'),
					it('puente', 2), it('sentadilla', 2)
				]
			};
		}

		function estadoPorDefecto() {
			const tiempos = {};
			BIBLIOTECA.forEach(b => tiempos[b.id] = b.valor);
			return { tiempos, rutinas: rutinasPorDefecto(), historial: [], custom: [], borrados: [] };
		}

		// Valida/limpia un estado (propio o importado) y rellena lo que falte
		function sanear(e, def) {
			const out = { tiempos: Object.assign({}, def.tiempos), rutinas: {}, historial: [], custom: sanearCustom(e && e.custom), borrados: [] };
			if (e && Array.isArray(e.borrados)) out.borrados = e.borrados.filter(id => typeof id === 'string' && /^[a-z0-9_]{1,60}$/.test(id)).slice(-200);
			reconstruirBiblioteca(out.custom);
			if (e && e.tiempos) {
				const tOld = Object.assign({}, e.tiempos);
				Object.keys(MIGRACION_IDS).forEach(a => {
					if (tOld[a] !== undefined && tOld[MIGRACION_IDS[a]] === undefined) tOld[MIGRACION_IDS[a]] = tOld[a];
				});
				BIBLIOTECA.forEach(b => {
					const v = Math.round(Number(tOld[b.id]));
					if (v > 0 && v < 10000) out.tiempos[b.id] = v;
				});
			}
			DIAS.forEach(d => {
				const lista = (e && e.rutinas && Array.isArray(e.rutinas[d])) ? e.rutinas[d] : def.rutinas[d];
				out.rutinas[d] = lista
					.map(x => (x && MIGRACION_IDS[x.id]) ? Object.assign({}, x, { id: MIGRACION_IDS[x.id] }) : x)
					.filter(x => { const ok = x && EJ[x.id]; if (!ok) console.warn('Rutina', d, ': ejercicio inexistente, se omite ->', x && x.id); return ok; })
					.map(x => {
					const o = { id: x.id, series: Math.max(1, Math.min(20, parseInt(x.series) || 1)) };
					if (typeof x.peso === 'string' && x.peso !== '') o.peso = x.peso;
					return o;
					});
			});
			if (e && Array.isArray(e.historial)) {
				out.historial = e.historial
					.filter(h => h && DIAS.includes(h.dia) && /^\d{4}-\d{2}-\d{2}$/.test(h.fecha))
					.map(h => ({ dia: h.dia, fecha: h.fecha, ts: Number(h.ts) || 0 }))
					.slice(-100);
			}
			BIBLIOTECA.forEach(b => { if (!(out.tiempos[b.id] > 0)) out.tiempos[b.id] = b.valor; });
			return out;
		}

		// Recupera los tiempos/reps que tuvieras guardados con la versión anterior de la app
		function migrarTiemposAntiguos(tiempos) {
			try {
				const viejo = JSON.parse(localStorage.getItem('rutinas'));
				if (!viejo) return;
				const porImg = {};
				BIBLIOTECA.forEach(b => porImg[b.img] = b);
				Object.values(viejo).forEach(lista => lista.forEach(ej => {
					const b = porImg[ej.img];
					if (!b) return;
					const v = ej.tipo === 'fuerza' ? ej.reps : ej.tiempo;
					if (Number.isFinite(v) && v > 0) tiempos[b.id] = v;
				}));
			} catch (_) {}
		}

		function cargarEstado() {
			const def = estadoPorDefecto();
			let guardado = null;
			try { guardado = JSON.parse(localStorage.getItem('isx_v2')); } catch (_) {}
			if (!guardado) {
				migrarTiemposAntiguos(def.tiempos);
				return sanear(null, def); // también las rutinas por defecto pasan el filtro
			}
			return sanear(guardado, def);
		}

		function guardar() {
			localStorage.setItem('isx_v2', JSON.stringify(estado));
		}

		let estado = cargarEstado();
		guardar();

		function pesoDe(item) {
			return item.peso !== undefined ? item.peso : EJ[item.id].peso;
		}


		/* =====================================================================
		   HISTORIAL
		   ===================================================================== */
		function fechaLocal(dt) {
			const p = n => String(n).padStart(2, '0');
			return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
		}
		function diasDesde(fecha) {
			const [y, m, d] = fecha.split('-').map(Number);
			const hoy = new Date();
			const a = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
			return Math.round((a - new Date(y, m - 1, d)) / 86400000);
		}
		function textoHace(n) {
			return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`;
		}
		function registrarEntreno(dia) {
			estado.historial.push({ dia, fecha: fechaLocal(new Date()), ts: Date.now() });
			estado.historial = estado.historial.slice(-100);
			guardar();
		}
		function ultimoDe(dia) {
			for (let i = estado.historial.length - 1; i >= 0; i--) {
				if (estado.historial[i].dia === dia) return estado.historial[i];
			}
			return null;
		}
		// Sugerencia: el día que sigue al último entrenado (1 → 2 → 3 → 1...)
		function diaSugerido() {
			const u = estado.historial[estado.historial.length - 1];
			return u ? DIAS[(DIAS.indexOf(u.dia) + 1) % DIAS.length] : null;
		}

		/* =====================================================================
		   ENTRENAMIENTO
		   ===================================================================== */
		let diaActual = null;
		let ejercicioIdx = 0;
		let intervalActual = null;
		let plan = [];
		let terminado = false;

		// Convierte la rutina del día en la lista de pasos reales (series, lados...)
		function construirPlan(dia) {
			const pasos = [];
			estado.rutinas[dia].forEach(item => {
				const b = EJ[item.id];
				const n = item.series;
				const base = { id: b.id, peso: pesoDe(item), total: n };
				for (let s = 1; s <= n; s++) {
					if (b.unilateral) {
						pasos.push(Object.assign({}, base, { lado: 'dcha', serie: s }));
						pasos.push(Object.assign({}, base, { lado: 'izda', serie: s }));
					} else {
						pasos.push(Object.assign({}, base, { serie: s }));
					}
				}
			});
			return pasos;
		}

        function cargarDia(dia) {
			const nuevoPlan = construirPlan(dia);
			if (!nuevoPlan.length) {
				alert('Esta rutina está vacía. Añade ejercicios desde ⚙️ › Rutinas.');
				return;
			}
			plan = nuevoPlan;
			diaActual = dia;
			ejercicioIdx = 0;
			terminado = false;

			document.getElementById('portada').style.display = 'none';
			document.getElementById('ui-sub').style.display = 'none';
			document.getElementById('vista-entreno').style.setProperty('--rgb', COLORES_RGB[dia]);
			document.getElementById('vista-entreno').style.display = 'flex';
			document.body.classList.add('en-entreno');
			document.getElementById('ui-imagen-ejercicio').style.display = 'block';
			document.getElementById('btn-control').style.display = 'block';
			document.getElementById('fila-navegacion').style.display = 'flex';

			renderizarEjercicio();
		}

		const CIRC = 2 * Math.PI * 88; // perímetro del anillo (r = 88)

		function nombrePaso(p) {
			return EJ[p.id].nombre + (p.lado ? ' ' + p.lado : '');
		}

		function resetAnillo() {
			const a = document.getElementById('ui-anillo');
			a.style.setProperty('transition', 'none');
			a.style.setProperty('stroke-dashoffset', '0');
			document.getElementById('ui-timer').classList.remove('urgente');
		}

		function renderizarEjercicio() {
			if (intervalActual) {
				clearInterval(intervalActual);
				intervalActual = null;
			}

			if (!plan[ejercicioIdx] || !EJ[plan[ejercicioIdx].id]) {
				plan = construirPlan(diaActual);
				if (!plan.length) { location.reload(); return; }
				ejercicioIdx = Math.min(ejercicioIdx, plan.length - 1);
			}
			const paso = plan[ejercicioIdx];
			const b = EJ[paso.id];
			const valor = estado.tiempos[b.id];

			// Progreso
			document.getElementById('ui-prog-txt').innerText = `Ejercicio ${ejercicioIdx + 1} de ${plan.length}`;
			document.getElementById('ui-prog-dia').innerText = NOMBRES[diaActual];
			document.getElementById('ui-prog-fill').style.width = ((ejercicioIdx + 1) / plan.length * 100) + '%';
			const sig = plan[ejercicioIdx + 1];
			document.getElementById('ui-siguiente').innerText = sig ? 'Siguiente: ' + nombrePaso(sig) : 'Último ejercicio';

			document.getElementById('ui-nombre').innerText = nombrePaso(paso);
			document.getElementById('ui-imagen-ejercicio').style.visibility = 'visible';
			document.getElementById('ui-imagen-ejercicio').src = srcEj(b);
			if (!srcEj(b)) document.getElementById('ui-imagen-ejercicio').style.visibility = 'hidden';

			document.getElementById('ui-desc').innerText = b.desc || '';
			const partes = [];
			if (b.tipo === 'fuerza') partes.push(`Peso: ${paso.peso}`);
			if (paso.total > 1) partes.push(`Serie ${paso.serie}/${paso.total}`);
			document.getElementById('ui-info').innerText = partes.join('\n');

			// Anillo: en isométricos se vacía con el tiempo; en fuerza queda lleno con las repeticiones
			resetAnillo();
			document.getElementById('ui-timer').style.display = 'block';
			document.getElementById('ui-timer-num').innerText = valor;
			document.getElementById('ui-timer-label').innerText = esTiempo(b) ? 'segundos' : 'repeticiones';

			document.getElementById('btn-control').style.display = 'block';
			document.getElementById('btn-control').innerText = 'EMPEZAR';

			document.getElementById('fila-navegacion').style.display = 'flex';
			document.getElementById('btn-anterior').disabled = (ejercicioIdx === 0);
			document.getElementById('btn-siguiente').innerText = (ejercicioIdx === plan.length - 1) ? 'Finalizar ➡' : 'Siguiente ➡';
		}

		function irAnterior() {
			if (ejercicioIdx > 0) {
				ejercicioIdx--;
				renderizarEjercicio();
			}
		}

		function irSiguiente() {
			avanzar();
		}

		function manejarAccion() {
			const paso = plan[ejercicioIdx];
			const b = EJ[paso.id];

			if (esTiempo(b)) {
				document.getElementById('btn-control').style.display = 'none';
				let t = estado.tiempos[b.id];
				const num = document.getElementById('ui-timer-num');
				num.innerText = t;

				// El anillo se vacía de forma continua durante todo el tiempo del ejercicio
				const anillo = document.getElementById('ui-anillo');
				resetAnillo();
				void anillo.getBoundingClientRect(); // fuerza al navegador a registrar el estado inicial
				anillo.style.setProperty('transition', `stroke-dashoffset ${t}s linear`);
				anillo.style.setProperty('stroke-dashoffset', String(CIRC));

				intervalActual = setInterval(() => {
					t--;
					num.innerText = t;

					if (t > 0 && t <= 5) {
						document.getElementById('ui-timer').classList.add('urgente');
						emitirPitido();
					}

					if (t <= 0) {
						clearInterval(intervalActual);
						intervalActual = null;
						avanzar();
					}
				}, 1000);
			} else {
				avanzar();
			}
		}

		// Un único AudioContext reutilizado (crear uno por pitido acaba bloqueando el audio)
		let audioCtx = null;
		function emitirPitido() {
			try {
				if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				if (audioCtx.state === 'suspended') audioCtx.resume();
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();

				osc.type = 'square';
				osc.frequency.setValueAtTime(440, audioCtx.currentTime);
				gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);

				osc.connect(gain);
				gain.connect(audioCtx.destination);
				osc.start();
				osc.stop(audioCtx.currentTime + 0.5);
			} catch (err) {
				console.error('No se pudo emitir el pitido:', err);
			}
		}

        function avanzar() {
			if (intervalActual) {
				clearInterval(intervalActual);
				intervalActual = null;
			}

			ejercicioIdx++;
			if (ejercicioIdx < plan.length) {
				renderizarEjercicio();
			} else {
				terminado = true;
				registrarEntreno(diaActual);
				document.getElementById('ui-nombre').innerText = "¡Completado!";
				document.getElementById('ui-imagen-ejercicio').style.visibility = 'visible';
				document.getElementById('ui-imagen-ejercicio').src = "trofeo.png";
				document.getElementById('ui-prog-txt').innerText = 'Rutina completada';
				document.getElementById('ui-prog-fill').style.width = '100%';
				document.getElementById('ui-timer').style.display = 'none';
				document.querySelector('.fila-reloj').classList.add('fin');
				document.getElementById('ui-siguiente').innerText = '';
				document.getElementById('ui-desc').innerText = '';
				document.getElementById('ui-info').innerText = `${NOMBRES[diaActual]} guardado en tu historial ✓`;
				document.getElementById('btn-control').innerText = "VOLVER AL INICIO";
				document.getElementById('btn-control').style.display = 'block';
				document.getElementById('btn-control').onclick = () => location.reload();
				document.getElementById('fila-navegacion').style.display = 'none';
			}
		}

		/* =====================================================================
		   AJUSTES
		   ===================================================================== */
		// Pequeño helper para construir elementos sin tener que escapar HTML
		function el(tag, attrs, ...hijos) {
			const e = document.createElement(tag);
			Object.entries(attrs || {}).forEach(([k, v]) => {
				if (k === 'class') e.className = v;
				else if (k === 'style') e.style.cssText = v;
				else if (k.startsWith('on')) e[k] = v;
				else if (v === true) e.setAttribute(k, '');
				else if (v !== false && v != null) e.setAttribute(k, v);
			});
			hijos.flat().forEach(h => { if (h != null) e.append(h); });
			return e;
		}
		function iniciales(nombre) {
			const letras = nombre.split(' ').filter(w => w.length > 3).slice(0, 2).map(w => w[0].toUpperCase()).join('');
			return letras || nombre[0].toUpperCase();
		}
		// Fotos hechas desde la app: se guardan en el móvil (localStorage) hasta que se suben a GitHub
		const FOTOS = {};
		function fotoLocal(id) {
			if (!(id in FOTOS)) { try { FOTOS[id] = localStorage.getItem('isx_img_' + id); } catch (_) { FOTOS[id] = null; } }
			return FOTOS[id];
		}
		function guardarFoto(id, dataUrl) {
			try { localStorage.setItem('isx_img_' + id, dataUrl); FOTOS[id] = dataUrl; return true; }
			catch (_) { return false; }
		}
		function borrarFoto(id) {
			try { localStorage.removeItem('isx_img_' + id); } catch (_) {}
			FOTOS[id] = null;
		}
		function srcEj(b) { return fotoLocal(b.id) || b.img || ''; }

		// Reduce la foto a 640 px y la convierte a JPEG (≈ 40-60 KB)
		function procesarFoto(file) {
			return new Promise((resolve, reject) => {
				const url = URL.createObjectURL(file);
				const im = new Image();
				im.onload = () => {
					const k = Math.min(1, 640 / Math.max(im.width, im.height));
					const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
					const c = document.createElement('canvas');
					c.width = w; c.height = h;
					const ctx = c.getContext('2d');
					ctx.fillStyle = '#fff';
					ctx.fillRect(0, 0, w, h);
					ctx.drawImage(im, 0, 0, w, h);
					URL.revokeObjectURL(url);
					resolve(c.toDataURL('image/jpeg', 0.78));
				};
				im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer esa imagen.')); };
				im.src = url;
			});
		}

		// Si falta la imagen (o no carga), se muestra un recuadro con las iniciales del ejercicio
		function imgEj(b, clase) {
			const src = srcEj(b);
			const ph = () => el('div', { class: (clase ? clase + ' ' : '') + 'sin-img' }, iniciales(b.nombre));
			if (!src) return ph();
			return el('img', { class: clase, src, onerror: function () { this.replaceWith(ph()); } });
		}

		// ---------- Pestaña RUTINAS ----------
		function pintarRutinas(cont) {
			const pills = el('div', { class: 'pills' });
			DIAS.forEach(d => {
				pills.append(el('button', {
					class: 'pill' + (d === ajusteDia ? ' activa' : ''),

				}, NOMBRES[d]));
			});

			const lista = estado.rutinas[ajusteDia];
			const nPasos = construirPlan(ajusteDia).length;
			cont.append(el('p', { class: 'nota' },
				`${lista.length} ejercicios · ${nPasos} pasos en total. Las series de los ejercicios por lados (zancadas, plancha lateral) son por cada lado.`));

			if (!lista.length) cont.append(el('div', { class: 'vacio' }, 'Rutina vacía. Añade ejercicios.'));

			lista.forEach((item, i) => {
				const b = EJ[item.id];
				const valor = estado.tiempos[b.id];
				const resumen = esTiempo(b) ? `${valor} s` : `${valor} reps`;

				const inputSeries = el('input', {
					type: 'number', min: '1', max: '20', class: 'input-tiempo', value: String(item.series),
					onchange: function () {
						item.series = Math.max(1, Math.min(20, parseInt(this.value) || 1));
						this.value = item.series;
						guardar();
					}
				});
				const ctrl = el('div', { class: 'rut-ctrl' },
					el('label', {}, b.unilateral ? 'series/lado' : 'series', inputSeries));

				if (b.tipo === 'fuerza') {
					ctrl.append(el('label', {}, 'peso', el('input', {
						type: 'text', class: 'input-tiempo input-peso', value: pesoDe(item),
						onchange: function () {
							const v = this.value.trim();
							if (v === '' || v === b.peso) { delete item.peso; this.value = b.peso; }
							else item.peso = v;
							guardar();
						}
					})));
				}

				ctrl.append(
					el('span', { class: 'espacio' }),
					el('button', { class: 'btn-ico', disabled: i === 0, title: 'Subir',
						onclick: () => { [lista[i - 1], lista[i]] = [lista[i], lista[i - 1]]; guardar(); pintarAjustes(); } }, '↑'),
					el('button', { class: 'btn-ico', disabled: i === lista.length - 1, title: 'Bajar',
						onclick: () => { [lista[i + 1], lista[i]] = [lista[i], lista[i + 1]]; guardar(); pintarAjustes(); } }, '↓'),
					el('button', { class: 'btn-ico', title: 'Cambiar por otro ejercicio',
						onclick: () => abrirSelector('Cambiar por…', id => {
							item.id = id;
							delete item.peso; // el peso vuelve al valor por defecto del nuevo ejercicio
							guardar(); pintarAjustes();

					el('button', { class: 'btn-ico', title: 'Quitar',
						onclick: () => { lista.splice(i, 1); guardar(); pintarAjustes(); } }, '🗑')
				);

				cont.append(el('div', { class: 'rut-fila' },

					ctrl));

			cont.append(
				el('button', { class: 'btn-sec', onclick: () => abrirSelector('Añadir a ' + NOMBRES[ajusteDia], id => {
					estado.rutinas[ajusteDia].push({ id, series: 1 });
					guardar(); pintarAjustes();
					const p = document.getElementById('pantalla-ajustes');
					p.scrollTop = p.scrollHeight;
				}) }, '+ Añadir ejercicio'),
				el('button', { class: 'btn-sec btn-peligro', onclick: () => {
					if (confirm(`¿Restaurar ${NOMBRES[ajusteDia]} a la rutina original?`)) {
						estado.rutinas[ajusteDia] = rutinasPorDefecto()[ajusteDia];
						guardar(); pintarAjustes();
					}
				} }, `Restaurar ${NOMBRES[ajusteDia]} original`)
			);
		}

		function pintarCopia(cont) {
			const inputArchivo = el('input', {
				type: 'file', accept: 'application/json,.json', style: 'display:none',
				onchange: function () { if (this.files[0]) importar(this.files[0]); this.value = ''; }
			});
			cont.append(

				el('button', { class: 'btn-sec', onclick: exportar }, '⬇ Exportar copia de seguridad'),

				inputArchivo,
				el('button', { class: 'btn-sec btn-peligro', onclick: () => {
					if (confirm('¿Restablecer TODAS las rutinas y tiempos a los valores originales?')) {
						const hist = estado.historial, cust = estado.custom, borr = estado.borrados; // no se pierden al restablecer
						estado = estadoPorDefecto();
						estado.historial = hist; estado.custom = cust; estado.borrados = borr;
						BIBLIOTECA.forEach(b => { if (!(estado.tiempos[b.id] > 0)) estado.tiempos[b.id] = b.valor; });
						guardar(); pintarAjustes();
					}
				} }, 'Restablecer rutinas y tiempos a original'),
				el('button', { class: 'btn-sec btn-peligro', onclick: () => {
					if (confirm(`¿Borrar el historial (${estado.historial.length} entrenamientos registrados)?`)) {
						estado.historial = [];
						guardar(); pintarAjustes(); pintarPortada();
					}
				} }, 'Borrar historial de entrenamientos')
			);

		function exportar() {
			const datos = Object.assign({ app: 'Isometrix2', version: 3 }, estado);
			const fotos = {};
			estado.custom.forEach(c => { const f = fotoLocal(c.id); if (f) fotos[c.id] = f; });
			if (Object.keys(fotos).length) datos.fotos = fotos;
			const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
			const a = document.createElement('a');
			a.href = URL.createObjectURL(blob);
			a.download = 'isometrix2-copia.json';
			document.body.appendChild(a);
			a.click();
			a.remove();
			setTimeout(() => URL.revokeObjectURL(a.href), 2000);
		}

		function importar(archivo) {
			const lector = new FileReader();
			lector.onload = () => {
				try {
					const e = JSON.parse(lector.result);
					if (!e || (!e.rutinas && !e.tiempos)) throw new Error('formato');
					estado = sanear(e, estadoPorDefecto());
					// lo importado se considera pendiente de subir; se recuperan también las fotos guardadas en la copia
					estado.custom.forEach(c => { c.sync = 'local'; delete c.dirty; });
					estado.borrados = [];
					if (e.fotos && typeof e.fotos === 'object') {
						Object.keys(e.fotos).forEach(id => {
							const d = e.fotos[id], c = estado.custom.find(x => x.id === id);
							if (c && c.img && typeof d === 'string' && d.length < 600000 && /^data:image\/(jpeg|png|webp);base64,/.test(d) && guardarFoto(id, d)) c.fotoPendiente = true;
						});
					}
					guardar();
					pintarAjustes();
					pintarPortada();
					alert('Copia importada correctamente.');
				} catch (_) {
					alert('El archivo no es una copia válida de Isometrix2.');
				}
			};
			lector.readAsText(archivo);
		}

		   SELECTOR DE EJERCICIOS (rejilla con imágenes)

		let selCallback = null;
		let filtroTipo = 'todos';
		let filtroGrupo = 'todos';

		function normalizar(s) {
			return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
		}

		function abrirSelector(titulo, alElegir) {
			selCallback = alElegir;

			document.getElementById('selector-ejercicios').style.display = 'none';
			selCallback = null;

			const g = document.getElementById('chips-grupo');

			pintarChips();
			const q = normalizar(document.getElementById('sel-buscar').value);

			grid.innerHTML = '';

			const resultados = BIBLIOTECA.filter(b =>
				(filtroGrupo === 'todos' || b.grupo === filtroGrupo) &&
				(filtroTipo === 'todos' || b.tipo === filtroTipo) &&
				normalizar(b.nombre).includes(q));

			if (!resultados.length) {
				grid.append(el('div', { class: 'vacio', style: 'grid-column:1/-1' }, 'Sin resultados'));
				return;

			resultados.forEach(b => {

				grid.append(el('button', {

					onclick: () => { const cb = selCallback; cerrarSelector(); if (cb) cb(b.id); }
				},
					imgEj(b, ''),
					b.nombre,
					usos ? el('em', {}, `ya en ${NOMBRES[ajusteDia]}` + (usos > 1 ? ` ×${usos}` : '')) : null));
			});
		}

		/* =====================================================================
		   PORTADA: una tarjeta por día con resumen de la rutina
		   ===================================================================== */
		// Estimación orientativa: isométricos = su tiempo + 5 s de transición;
		// fuerza = ~3 s por repetición + 10 s de preparación
		function minutosEstimados(dia) {
			let seg = 0;
			construirPlan(dia).forEach(p => {
				const b = EJ[p.id];
				const v = estado.tiempos[b.id];
				seg += esTiempo(b) ? v + 5 : v * 3 + 10;
			});
			return Math.max(1, Math.round(seg / 60));
		}

		function pintarPortada() {
			const cont = document.getElementById('portada');
			cont.innerHTML = '';
			const sug = diaSugerido();
			const ultimo = estado.historial[estado.historial.length - 1];
			const hoyHecho = !!ultimo && diasDesde(ultimo.fecha) <= 0;

			// Subtítulo
			let sub = 'Elige una rutina para empezar';

		function nuevoId(nombre) {
			const base = normalizar(nombre).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30) || 'ejercicio';
			let id;
			do { id = base + '_' + Math.random().toString(36).slice(2, 6); } while (EJ[id] || estado.borrados.includes(id));
			return id;
		}

		function guardarForm(c, f) {
			const nombre = f.iNombre.value.trim();
			if (!nombre) { alert('Escribe un nombre.'); return; }
			if (BIBLIOTECA.some(b => b.id !== (c && c.id) && normalizar(b.nombre) === normalizar(nombre))) {
				alert('Ya existe un ejercicio con ese nombre.'); return;
			}
			const valor = parseInt(f.iValor.value);
			if (!(valor > 0)) { alert('La duración o las repeticiones deben ser un número mayor que 0.'); return; }
			const typed = f.iRuta.value.trim();
			const ruta = limpiarRuta(typed);
			if (typed && !ruta) { alert('Nombre de archivo no válido. Usa algo como fuerza/fondos.png (sin espacios, tildes ni ñ).'); return; }

			const tipo = f.sTipo.value;
			const id = c ? c.id : nuevoId(nombre);
			const datos = { nombre, tipo, grupo: f.sGrupo.value, valor, img: c ? c.img : '' };
			if (tipo === 'fuerza') datos.peso = f.iPeso.value.trim() || '0';
			if (f.cUni.checked) datos.unilateral = true;
			if (f.iDesc.value.trim()) datos.desc = f.iDesc.value.trim();

			let fotoPendiente = c ? !!c.fotoPendiente : false;
			if (formFoto) {
				if (!guardarFoto(id, formFoto)) { alert('No hay espacio en el móvil para guardar la foto. Prueba con otra más pequeña o borra ejercicios que ya no uses.'); return; }
				datos.img = `${CARPETAS[tipo]}/${id}-${Date.now().toString(36)}.jpg`;
				fotoPendiente = true;
			} else if (!c || typed !== c.img) {
				datos.img = ruta;           // archivo del repositorio (o ninguno)
				if (c) { borrarFoto(id); fotoPendiente = false; }
			}

			if (c) {
				['peso', 'unilateral', 'desc'].forEach(k => delete c[k]);
				Object.assign(c, datos);
				if (c.sync === 'subido') c.dirty = true;
				if (fotoPendiente) c.fotoPendiente = true; else delete c.fotoPendiente;
			} else {
				const nuevo = Object.assign({ id, sync: 'local' }, datos);
				if (fotoPendiente) nuevo.fotoPendiente = true;
				estado.custom.push(nuevo);
			}
			estado.tiempos[id] = valor;
			reconstruirBiblioteca(estado.custom);

			pintarAjustes();
			pintarPortada();

		/* =====================================================================
		   SINCRONIZACIÓN CON GITHUB
		   Los ejercicios propios se guardan en ejercicios.json (raíz del repositorio) y sus fotos
		   en la carpeta de su tipo. La app usa la API de GitHub con un token personal.
		   ===================================================================== */
		const GH_DEFECTO = { owner: 'rafgil68', repo: 'ejercicios', branch: 'main' };
		const UN_DIA = 24 * 60 * 60 * 1000;

		function ghConfig() {
			try {
				const c = JSON.parse(localStorage.getItem('isx_gh'));
				if (c && c.token && c.owner && c.repo) return { token: c.token, owner: c.owner, repo: c.repo, branch: c.branch || 'main' };
			} catch (_) {}
			return null;
		}
		function ghInfoGet() { try { return JSON.parse(localStorage.getItem('isx_gh_info')); } catch (_) { return null; } }
		function ghInfoSet(o) { try { localStorage.setItem('isx_gh_info', JSON.stringify(o)); } catch (_) {} }

		function hace(ts) {
			const m = Math.round((Date.now() - ts) / 60000);
			if (m < 1) return 'ahora mismo';
			if (m < 60) return `hace ${m} min`;
			const h = Math.round(m / 60);
			return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`;
		}
		function ghEstadoTexto() {
			const cfg = ghConfig();
			if (!cfg) return 'Sin configurar: los ejercicios nuevos solo se guardan en este móvil.';
			const pend = pendientesSync();
			const info = ghInfoGet();
			let t = `Conectado a ${cfg.owner}/${cfg.repo} (rama ${cfg.branch}). `;
			t += pend ? `${pend} cambio(s) pendiente(s) de subir. ` : 'Todo sincronizado. ';
			if (info) t += info.ok ? `Última sincronización: ${hace(info.ts)}.` : `Último intento fallido: ${info.msg}`;
			return t;
		}
		function setGhEstado(texto) {
			const p = document.getElementById('gh-msg');
			if (p) p.textContent = texto || ghEstadoTexto();
		}

		function ghError(res) {
			const e = new Error();
			e.status = res.status;
			if (res.status === 401) e.mensaje = 'El token no es válido o ha caducado.';
			else if (res.status === 403) e.mensaje = 'GitHub rechazó la operación (¿el token tiene permiso "Contents: lectura y escritura"? ¿demasiadas peticiones seguidas?).';
			else if (res.status === 404) e.mensaje = 'No encuentro el repositorio, o el token no tiene acceso a él.';
			else if (res.status === 409 || res.status === 422) { e.mensaje = 'Conflicto al escribir en GitHub.'; e.conflicto = true; }
			else e.mensaje = `Error de GitHub (${res.status}).`;
			e.message = e.mensaje;
			return e;
		}
		function ghFetch(cfg, ruta, opts) {
			opts = opts || {};
			return fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${ruta}`, Object.assign({}, opts, {
				cache: 'no-store',
				headers: Object.assign({
					'Accept': 'application/vnd.github+json',
					'Authorization': 'Bearer ' + cfg.token,
					'X-GitHub-Api-Version': '2022-11-28'
				}, opts.headers || {})
			}));
		}
		function b64utf8(str) {
			const bytes = new TextEncoder().encode(str);
			let bin = '';
			bytes.forEach(b => { bin += String.fromCharCode(b); });
			return btoa(bin);
		}
		function utf8b64(b64) {
			const bin = atob(b64);
			return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
		}
		function ghPut(cfg, ruta, base64, mensaje, sha) {
			const body = { message: mensaje, content: base64, branch: cfg.branch };
			if (sha) body.sha = sha;
			return ghFetch(cfg, '/contents/' + ruta.split('/').map(encodeURIComponent).join('/'), {
				method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
			});
		}
		async function ghLeerJson(cfg) {
			const res = await ghFetch(cfg, `/contents/ejercicios.json?ref=${encodeURIComponent(cfg.branch)}`);
			if (res.status === 404) return { sha: null, lista: [] };
			if (!res.ok) throw ghError(res);
			const data = await res.json();
			try {
				return { sha: data.sha, lista: limpiarListaRemota(JSON.parse(utf8b64(String(data.content || '').replace(/\s/g, '')))) };
			} catch (_) {
				const e = new Error('ejercicios.json no válido');
				e.mensaje = 'El archivo ejercicios.json del repositorio no es válido; no lo toco para no perder datos.';
				throw e;
			}
		}
		async function probarConexion(cfg) {
			const res = await ghFetch(cfg, '');
			if (!res.ok) throw ghError(res);
			const j = await res.json();
			if (j.permissions && j.permissions.push === false) {
				const e = new Error('solo lectura');
				e.mensaje = 'El token solo puede leer el repositorio: necesita permiso de escritura en "Contents".';
				throw e;
			}
			const rb = await ghFetch(cfg, '/branches/' + encodeURIComponent(cfg.branch));
			if (rb.status === 404) {
				const e = new Error('rama');
				e.mensaje = `La rama "${cfg.branch}" no existe en el repositorio.`;
				throw e;
			}
			return j;
		}

		function copiarDatos(c, r) {
			['nombre', 'tipo', 'grupo', 'valor', 'peso', 'unilateral', 'desc', 'img'].forEach(k => delete c[k]);
			Object.assign(c, paraJson(r));
		}
		function limpiarFotosViejas() {
			const ahora = Date.now();
			estado.custom.forEach(c => {
				if (c.sync === 'subido' && !c.dirty && !c.fotoPendiente && c.subidoTs && ahora - c.subidoTs > UN_DIA && fotoLocal(c.id)) borrarFoto(c.id);
			});
		}

		// Una pasada completa: leer GitHub -> mezclar con lo local -> subir fotos -> escribir ejercicios.json
		async function sincronizarUnaVez(cfg) {
			const { sha, lista: remoto } = await ghLeerJson(cfg);
			const idsRemotos = new Set(remoto.map(r => r.id));
			const ahora = Date.now();

			// 1) GitHub -> local
			remoto.forEach(r => {
				if (estado.borrados.includes(r.id)) return;
				const c = estado.custom.find(x => x.id === r.id);
				if (!c) estado.custom.push(Object.assign({}, r, { sync: 'subido', subidoTs: 0 }));
				else if (c.sync === 'subido' && !c.dirty && !c.fotoPendiente && JSON.stringify(paraJson(c)) !== JSON.stringify(paraJson(r))) copiarDatos(c, r);
			});
			// 2) borrados desde otro dispositivo: estaban subidos, sin cambios locales, y ya no están en GitHub.
			//    El borrado local se aplaza si hay un entrenamiento en curso, pero NUNCA se vuelven a subir.
			const borradosFuera = new Set(estado.custom
				.filter(c => c.sync === 'subido' && !c.dirty && !c.fotoPendiente && !idsRemotos.has(c.id))
				.map(c => c.id));
			if (!diaActual) borradosFuera.forEach(id => quitarLocal(id));
			// 3) fotos pendientes -> GitHub
			for (const c of estado.custom.filter(x => x.fotoPendiente)) {
				const data = fotoLocal(c.id);
				if (!data || !c.img) { c.fotoPendiente = false; continue; }
				const res = await ghPut(cfg, c.img, data.split(',')[1], 'Añadir imagen: ' + c.nombre);
				if (!res.ok) {
					const j = await res.json().catch(() => ({}));
					if (!(res.status === 422 && /sha/i.test(j.message || ''))) throw ghError(res); // 422 "sha": ya estaba subida
				}
				c.fotoPendiente = false;
				guardar();
			}
			// 4) ejercicios.json (solo si hay cambios)
			const porId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
			const final = estado.custom.filter(c => !estado.borrados.includes(c.id) && !borradosFuera.has(c.id)).map(paraJson).sort(porId);
			const hayCambios = JSON.stringify(final) !== JSON.stringify(remoto.map(paraJson).sort(porId));
			if (hayCambios) {
				const res = await ghPut(cfg, 'ejercicios.json', b64utf8(JSON.stringify({ version: 1, ejercicios: final }, null, 2) + '\n'), 'Actualizar ejercicios', sha);
				if (res.status === 409 || res.status === 422) {
					const e = new Error('conflicto');
					e.conflicto = true;
					e.mensaje = 'Otro dispositivo modificó los ejercicios a la vez.';
					throw e;
				}
				if (!res.ok) throw ghError(res);
			}
			// 5) todo correcto
			estado.custom.forEach(c => { if (c.sync !== 'subido' || c.dirty) { c.sync = 'subido'; delete c.dirty; c.subidoTs = ahora; } });
			estado.borrados = [];
			BIBLIOTECA_BASE.concat(estado.custom).forEach(b => { if (!(estado.tiempos[b.id] > 0)) estado.tiempos[b.id] = b.valor; });
			limpiarFotosViejas();
			reconstruirBiblioteca(estado.custom);
			guardar();
			return { subido: hayCambios };
		}

		let sincronizando = false, resincronizar = false;
		async function sincronizar(manual) {
			const cfg = ghConfig();
			if (!cfg) { if (manual) toast('Primero configura el token de GitHub.'); return; }
			if (!navigator.onLine) { setGhEstado('Sin conexión: se sincronizará cuando vuelva la red.'); if (manual) toast('Sin conexión.'); return; }
			if (sincronizando) { resincronizar = true; return; }
			sincronizando = true;
			setGhEstado('Sincronizando…');
			try {
				let r = null;
				for (let i = 0; i < 3; i++) {
					try { r = await sincronizarUnaVez(cfg); break; }
					catch (e) { if (e.conflicto && i < 2) continue; throw e; }
				}
				ghInfoSet({ ts: Date.now(), ok: true });
				if (manual || (r && r.subido)) toast(r && r.subido ? '✓ Ejercicios sincronizados con GitHub' : '✓ Todo al día');
			} catch (e) {
				const msg = e.mensaje || 'sin conexión o error de red; queda pendiente.';
				ghInfoSet({ ts: Date.now(), ok: false, msg });
				toast('GitHub: ' + msg);
			} finally {
				sincronizando = false;
				refrescarTrasSync();
				if (resincronizar) { resincronizar = false; sincronizar(false); }
			}
		}
		function syncAuto() { if (ghConfig()) sincronizar(false); }

		function refrescarTrasSync() {
			pintarPortada();
			const aj = document.getElementById('pantalla-ajustes');
			if (aj && aj.style.display === 'block' && ajusteTab === 'ejercicios') pintarListaEj();
			setGhEstado();
		}

		// Sin token: solo lectura del ejercicios.json publicado (así otros dispositivos reciben los ejercicios)
		async function cargarRemotoPublico() {
			try {
				const res = await fetch('ejercicios.json', { cache: 'no-store' });
				if (!res.ok) return;
				const lista = limpiarListaRemota(await res.json());
				const ids = new Set(lista.map(r => r.id));
				const ahora = Date.now();
				let cambios = false;
				lista.forEach(r => {
					if (estado.borrados.includes(r.id)) return;
					const c = estado.custom.find(x => x.id === r.id);
					if (!c) { estado.custom.push(Object.assign({}, r, { sync: 'subido', subidoTs: 0 })); cambios = true; }
					else if (c.sync === 'subido' && !c.dirty && !c.fotoPendiente && ahora - (c.subidoTs || 0) > 15 * 60000 &&
						JSON.stringify(paraJson(c)) !== JSON.stringify(paraJson(r))) { copiarDatos(c, r); cambios = true; }
				});
				if (!diaActual) {
					estado.custom.filter(c => c.sync === 'subido' && !c.dirty && !c.fotoPendiente && ahora - (c.subidoTs || 0) > 15 * 60000 && !ids.has(c.id))
						.forEach(c => { quitarLocal(c.id); cambios = true; });
				}
				if (cambios) {
					BIBLIOTECA_BASE.concat(estado.custom).forEach(b => { if (!(estado.tiempos[b.id] > 0)) estado.tiempos[b.id] = b.valor; });
					reconstruirBiblioteca(estado.custom);
					guardar();
					refrescarTrasSync();
				}
			} catch (_) { /* sin red o archivo aún inexistente: no pasa nada */ }
		}

		function iniciarSync() {
			limpiarFotosViejas();
			const arrancar = () => { if (ghConfig()) sincronizar(false); else cargarRemotoPublico(); };
			arrancar();
			window.addEventListener('online', arrancar);
		}

		// ---------- Ajustes de GitHub (dentro de la pestaña Copia) ----------
		function pintarGitHub(cont) {
			const cfg = ghConfig();
			const v = cfg || Object.assign({ token: '' }, GH_DEFECTO);
			const attrs = { type: 'text', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false' };
			const iOwner = el('input', Object.assign({}, attrs, { value: v.owner }));
			const iRepo = el('input', Object.assign({}, attrs, { value: v.repo }));
			const iRama = el('input', Object.assign({}, attrs, { value: v.branch }));
			const iToken = el('input', { type: 'password', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
				placeholder: cfg ? '(token guardado: déjalo vacío para mantenerlo)' : 'Pega aquí el token (github_pat_...)' });

			cont.append(
				el('h3', { class: 'sub-grupo' }, 'Sincronizar ejercicios con GitHub'),
				el('p', { class: 'nota', id: 'gh-msg' }, ghEstadoTexto()),
				campo('Usuario', iOwner), campo('Repositorio', iRepo), campo('Rama', iRama), campo('Token', iToken),
				el('button', { class: 'btn-sec', onclick: async () => {
					const owner = iOwner.value.trim(), repo = iRepo.value.trim(), branch = iRama.value.trim() || 'main';
					const token = iToken.value.trim() || (cfg ? cfg.token : '');
					if (!/^[A-Za-z0-9_.\-]+$/.test(owner) || !/^[A-Za-z0-9_.\-]+$/.test(repo) || !/^[A-Za-z0-9_.\-\/]+$/.test(branch)) {
						alert('Usuario, repositorio o rama con caracteres no válidos.'); return;
					}
					if (!token) { alert('Pega primero el token.'); return; }
					const nueva = { token, owner, repo, branch };
					setGhEstado('Probando conexión…');
					try {
						await probarConexion(nueva);
						localStorage.setItem('isx_gh', JSON.stringify(nueva));
						iToken.value = '';
						toast('✓ Conexión correcta');
						setGhEstado();
						sincronizar(true);
					} catch (e) {
						const msg = e.mensaje || 'No se pudo conectar. Revisa la conexión a internet.';
						setGhEstado('✗ ' + msg);
						alert(msg);
					}
				} }, 'Guardar y probar conexión'),
				el('button', { class: 'btn-sec', onclick: () => sincronizar(true) }, '↻ Sincronizar ahora'),
				el('button', { class: 'btn-sec btn-peligro', onclick: () => {
					if (!confirm('¿Borrar el token de este móvil? Los ejercicios ya subidos siguen en GitHub.')) return;
					localStorage.removeItem('isx_gh');
					localStorage.removeItem('isx_gh_info');
					pintarAjustes();
				} }, 'Desconectar (borrar el token de este móvil)'),
				el('p', { class: 'nota' }, 'El token se guarda solo en este móvil y no se incluye en las copias de seguridad.')
			);
		}

		pintarPortada();
		iniciarSync();
    </script>
